<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마켓나우 | 가을 쇼핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--or:#BE5103;--or2:#B7410E;--ye:#FFCE1B;--teal:#069494;--ink:#1d1916;--sub:#8a7f77;--bg:#f7f4ef;--card:#fff;--soft:#f0eae2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;overflow-wrap:anywhere;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:60}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;border:0;outline:none}
button{cursor:pointer;background:none}
.wrap{width:min(1200px,92%);margin:0 auto;position:relative;z-index:2}

/* 배경 낙엽: 천천히 흔들리며 떨어짐 */
.leaf{position:fixed;top:-40px;font-size:18px;opacity:.3;pointer-events:none;z-index:1;animation:drift linear infinite}
@keyframes drift{0%{transform:translate3d(0,-10vh,0) rotate(0)}50%{transform:translate3d(16px,50vh,0) rotate(160deg)}100%{transform:translate3d(-12px,110vh,0) rotate(340deg)}}
@media (prefers-reduced-motion:reduce){.leaf{display:none}}

/* 헤더 */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);box-shadow:0 1px 14px rgba(0,0,0,.04)}
.top{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
.logo{font-size:21px;font-weight:900;color:var(--or);white-space:nowrap;flex:none}
.cat-open{background:var(--or);color:#fff;font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;white-space:nowrap;flex:none}
.cat-open:hover{background:var(--or)}
.search{flex:1 1 260px;display:flex;background:var(--soft);border-radius:999px;overflow:hidden;max-width:620px}
.search input{flex:1;min-width:0;background:transparent;padding:11px 18px}
.search button{background:transparent;color:var(--or);font-weight:700;padding:0 18px;flex:none}
.icons{display:flex;align-items:center;gap:18px;font-size:13px;white-space:nowrap;margin-left:auto;flex:none;color:#5a504a}
.icons a{position:relative}
.icons a{padding:7px 14px;border-radius:999px;transition:background .25s,color .25s}
.icons a:hover,.icons a:focus-visible,.icons a:active{background:var(--or);color:#fff}
.badge{position:absolute;top:-8px;right:-12px;background:var(--or);color:#fff;border-radius:10px;font-size:11px;padding:0 5px;min-width:18px;text-align:center}

/* 배너 */
.ad,.hero{position:relative;overflow:hidden;touch-action:pan-y;user-select:none}
.ad{background:var(--ink)}
.track{display:flex;transition:transform .5s ease}
.slide{position:relative;min-width:100%;color:#fff;display:flex;align-items:center;padding:0 28px;overflow:hidden}
.slide small{opacity:.85;display:block;font-weight:300}
.slide h3{font-size:18px;font-weight:700;position:relative}
.deco{position:absolute;right:50px;font-size:110px;opacity:.22;pointer-events:none}
.ad .slide{min-height:52px;padding:10px 44px 22px}
.ad .slide h3{font-size:14px;font-weight:500}
.ad .deco{display:none}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:18px;line-height:30px;text-align:center;z-index:2}
.arr.l{left:10px}.arr.r{right:10px}
.dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.hero{border-radius:22px;margin-top:18px}
.hero .slide{min-height:280px;padding:24px 60px 42px}
.hero .slide h3{font-size:32px;font-weight:900;line-height:1.3}

/* 카테고리 드로어 */
.overlay{position:fixed;inset:0;background:rgba(29,25,22,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:150}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);background:#fff;z-index:160;transform:translateX(-102%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:10px 0 30px rgba(0,0,0,.08)}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;font-size:17px;font-weight:700}
.dh button{font-size:18px;padding:0 4px;color:var(--sub)}
#catList{list-style:none;overflow-y:auto;flex:1;padding:4px 0}
#catList a{display:block;padding:12px 22px;border-radius:10px;margin:0 8px}
#catList a:hover{background:#fff1e3;color:var(--or)}
.ed-row{display:flex;align-items:center;gap:6px;padding:9px 14px;margin:0 8px 4px;border-radius:10px;background:var(--soft);cursor:grab}
.ed-row.over{background:#ffe5cc}
.ed-row label{flex:1;display:flex;gap:8px;align-items:center;min-width:0}
.ed-row button{width:28px;height:28px;border-radius:6px;background:#fff;flex:none}
.dquick{display:flex;justify-content:space-around;padding:14px 16px;font-size:13px;color:var(--sub)}
.dfoot{padding:8px 16px 18px;display:flex;gap:8px}

/* 공통 버튼/폼 */
.btn{display:block;width:100%;padding:14px;background:var(--or);color:#fff;border-radius:999px;font-weight:700;font-size:15px;margin-top:18px;text-align:center}
.btn:hover{background:var(--or2)}
.btn.inline{display:inline-block;width:auto;padding:11px 22px;margin-top:0}
.ed{flex:1;padding:13px;border-radius:999px;background:var(--or);color:#fff;font-weight:700;text-align:center}
.ed:hover{background:var(--or2)}
.ed.ghost{background:var(--soft);color:var(--ink)}
.form{width:100%;max-width:440px;margin:28px auto;background:#fff;border-radius:22px;padding:34px;box-shadow:0 8px 30px rgba(60,40,20,.05)}
.form h2{font-size:22px;margin-bottom:6px}
.form label{display:block;font-size:13px;color:#6b615a;margin:16px 0 6px}
.form .check{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px}
.form input,.form select,.form textarea{width:100%;padding:13px 14px;border-radius:12px;background:var(--soft)}
.form input:focus,.form textarea:focus{box-shadow:0 0 0 2px var(--or2)}
.form input[type=checkbox]{width:auto}
.err{color:#c4441a;font-size:13px;min-height:18px;margin-top:8px}
.muted{color:var(--sub);font-size:13px}

/* 본문 */
main{padding:0 0 48px;min-height:60vh}
.home{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:24px;align-items:start}
.main-col{min-width:0}
.sec{background:var(--card);border-radius:22px;padding:26px;margin-top:20px;box-shadow:0 8px 28px rgba(60,40,20,.04)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{font-size:19px;font-weight:700}
.sh .sub{font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px 14px}
.card{background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(60,40,20,.08)}
.cl{display:block;flex:1}
.thumb{height:150px;display:flex;align-items:center;justify-content:center;font-size:62px;background:linear-gradient(160deg,#fff4e6,#ffe3c4);border-radius:16px;margin:6px}
.pinfo{padding:10px 12px 4px}
.pname{font-size:14px;line-height:20px;margin-bottom:4px}
.rs{font-size:12px;color:var(--sub);margin-bottom:4px}
.price{font-weight:700;font-size:17px}
.rate{color:var(--or);font-weight:700;margin-right:6px}
.orig{text-decoration:line-through;color:#b9ada2;font-size:12px}
.tag{font-size:11px;color:var(--or);background:#fff0e0;padding:1px 7px;border-radius:999px;display:inline-block;margin-top:4px}
.add{margin:6px 12px 12px;padding:9px;background:var(--soft);color:var(--ink);border-radius:999px;font-weight:700;text-align:center;font-size:14px}
.add:hover{background:var(--or);color:#fff}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>.card{flex:0 0 170px;scroll-snap-align:start}
.disc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.dcard{background:linear-gradient(160deg,#fff4e6,#ffe0bd);border-radius:20px;padding:20px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s}
.dcard:hover{transform:translateY(-3px)}
.dcard .de{font-size:40px}
.dcard b{display:block;font-size:15px;margin:10px 0 4px;line-height:1.4}
.dcard small{color:#6b5a4c;font-size:12.5px;line-height:1.5;display:block}
.dcard em{font-style:normal;font-size:12px;color:#7a4a1e;margin-top:10px}

/* 오른쪽 박스 */
.side{position:sticky;top:112px;display:grid;gap:14px}
.pbox{border-radius:22px;padding:22px;color:#fff;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s}
.pbox:hover{transform:translateY(-3px)}
.pbox small{font-size:12px;opacity:.85}
.pbox b{font-size:18px;font-weight:700;line-height:1.35;margin:6px 0}
.pbox span{font-size:13px;opacity:.92}
.pbox.seller{background:linear-gradient(135deg,#2e2119,#5b3d28)}
.pbox.autumn{background:linear-gradient(135deg,#e8731a,#f5b544)}
.pbox.deal{background:linear-gradient(135deg,#b8481a,#7a2e12)}

/* 여행 테마 */
.hero-t{background:linear-gradient(120deg,#e8731a,#f5b544);color:#fff;border-radius:22px;padding:34px 30px;margin-top:18px;position:relative;overflow:hidden}
.hero-t h1{font-size:28px;font-weight:900;margin-bottom:6px}
.hero-t p{opacity:.92;font-size:14px}
.hero-t .big{position:absolute;right:26px;bottom:-10px;font-size:110px;opacity:.25}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;background:#fff;border-radius:999px;padding:6px;box-shadow:0 8px 24px rgba(60,40,20,.05)}
.chips a{padding:9px 16px;border-radius:999px;font-size:13px;color:#5a504a;white-space:nowrap}
.chips a.on,.chips a:hover{background:var(--or);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* 상품 상세 */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
.thumb.big{height:360px;font-size:150px;border-radius:22px;margin:0}
.crumb{margin-bottom:6px}
.pd h1{font-size:24px;line-height:1.35;margin-bottom:8px;font-weight:700}
.desc{color:#6b615a;margin-bottom:12px}
.stars{color:#e8a31a;font-size:17px;letter-spacing:2px}
.stars b{color:var(--ink);font-size:15px;letter-spacing:0;margin-left:4px}
.thumbs{display:inline-block;margin:10px 0;padding:8px 14px;background:#fff0e0;border-radius:999px;font-size:14px}
.thumbs b{color:#b8481a}
.pprice{margin-top:12px}
.pprice .price{font-size:28px;font-weight:900;color:var(--ink)}
.opts{margin-top:18px;display:grid;gap:14px}
.opts label{font-size:14px;font-weight:500}
.opts select{width:100%;padding:13px 14px;border-radius:12px;background:var(--soft);margin-top:6px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sz{position:relative}
.sz input{position:absolute;opacity:0;pointer-events:none}
.sz span{display:block;min-width:56px;text-align:center;padding:10px 12px;border-radius:999px;background:var(--soft);cursor:pointer;font-weight:500}
.sz input:checked+span{background:var(--or);color:#fff}
.qty{display:flex;align-items:center;gap:6px;margin-top:14px}
.qty button{width:32px;height:32px;border-radius:999px;background:var(--soft);font-size:16px}
.qty span{display:inline-block;width:40px;text-align:center;font-weight:700}
.total{margin-top:14px;font-size:15px}
.total b{font-size:20px;color:#b8481a}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.actions .fav{grid-column:1/-1;padding:13px;border-radius:999px;background:var(--soft);font-weight:700}
.actions .fav.on{background:#ffe9d6;color:#b8481a}
.subh{font-size:18px;font-weight:700;margin-bottom:12px}
.rv{padding:14px 0}
.rv+.rv{border-top:0;box-shadow:inset 0 1px 0 #f5efe8}
.rv .who{font-weight:700;font-size:14px}
.rv .txt{margin:6px 0;color:#4e4640;font-size:14px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:560px;border-collapse:separate;border-spacing:0;font-size:14px}
th,td{padding:12px 10px;text-align:center;vertical-align:middle}
th:first-child,td:first-child{text-align:left;color:#6b615a;white-space:nowrap}
th a{color:var(--ink);font-weight:700}
tr:nth-child(even) td{background:#faf6f0}
.ce{font-size:30px;display:block}
details{padding:12px 4px;margin-top:4px}
summary{cursor:pointer;font-weight:500}
details p{color:#4e4640;margin-top:8px;font-size:14px}
.guide{margin-top:10px;font-size:13px}
.guide td,.guide th{padding:6px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.menu a,.menu button{border-radius:16px;padding:18px;text-align:center;background:var(--soft)}
.menu a:hover{background:#ffe3c4}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.values div{background:var(--soft);border-radius:16px;padding:20px}
.values b{display:block;color:#b8481a;font-size:17px;margin-bottom:6px}
.row{display:flex;gap:14px;align-items:center;padding:14px 0}
.row .thumb{width:90px;height:90px;font-size:40px;flex:none;margin:0}
.row .info{flex:1;min-width:0}
.sum{background:var(--soft);border-radius:16px;padding:16px;margin-top:16px}
.sum div{display:flex;justify-content:space-between;margin:6px 0}
.sum .total{font-size:18px;font-weight:900;color:#b8481a}
.empty{text-align:center;padding:60px 0;color:var(--sub)}

.backbar{margin-top:18px}
.back{background:#fff;color:var(--ink);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:0 4px 14px rgba(60,40,20,.06)}
.back:hover{background:var(--or);color:#fff}
.foot-top{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap}
.foot-info{flex:1 1 360px;min-width:0}
.foot-boxes{display:grid;gap:12px;width:300px;max-width:100%}
.foot-boxes .pbox{min-height:92px;padding:16px 20px;border-radius:18px}
.foot-boxes .pbox b{font-size:16px;margin:4px 0}
@media (max-width:760px){.foot-boxes{width:100%;grid-template-columns:repeat(3,1fr)}.foot-boxes .pbox{min-height:110px;padding:14px}.foot-boxes .pbox b{font-size:14px}}
/* 푸터 */
footer{background:#2b221c;color:#e9dfd5;padding:30px 0;font-size:13px;margin-top:30px}
footer a{color:#fff}
footer p+p{margin-top:8px;opacity:.7}
.sns{display:flex;gap:12px;margin:14px 0 6px;flex-wrap:wrap}
.sns a{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#e9dfd5;transition:background .2s}
.sns a:hover{background:var(--or);color:#fff}
.sns svg{width:19px;height:19px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:300;width:max-content;max-width:90vw;text-align:center;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .home{grid-template-columns:1fr}
  .side{position:static;grid-template-columns:repeat(3,1fr)}
  .pbox{min-height:110px;padding:16px}
  .pbox b{font-size:15px}
  .disc-grid{grid-template-columns:repeat(2,1fr)}
  .tgrid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .top{gap:10px;padding:10px 0}
  .logo{font-size:19px}
  .cat-open{font-size:14px;padding:9px 14px}
  .search{order:3;flex:1 1 100%;max-width:none}
  .icons{order:4;width:100%;margin-left:0;justify-content:center;gap:16px;flex-wrap:nowrap}
  .hide-m{display:none}
  .ad .slide{padding:10px 40px 22px}
  .hero .slide{min-height:220px;padding:20px 22px 40px}
  .hero .slide h3{font-size:22px}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px 10px}
  .pd{grid-template-columns:1fr;gap:18px}
  .thumb.big{height:260px;font-size:110px}
  .values{grid-template-columns:1fr}
  .sec{padding:18px}
  .tgrid{grid-template-columns:1fr}
  .hero-t h1{font-size:22px}
  .pbox small{font-size:11px}
  .pbox span{font-size:12px}
}
/* 오른쪽 세로형 배너 (쿠팡 스타일) */
.side{position:sticky;top:112px;display:grid;gap:12px;align-self:start}
.pbox{position:relative;min-height:220px;border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;overflow:hidden;transition:transform .25s;color:#fff}
.pbox:hover{transform:translateY(-3px)}
.pbox small{font-size:12px;opacity:.85;font-weight:500}
.pbox b{position:relative;z-index:1;font-size:19px;font-weight:900;line-height:1.3;margin-top:6px;max-width:80%;word-break:keep-all}
.pbox .ico{position:absolute;right:8px;bottom:58px;font-size:72px;line-height:1;transform:rotate(-8deg);opacity:.95}
.pbox .go{margin-top:auto;position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;line-height:1;padding-bottom:2px}
.pbox.seller{background:#f5c842;color:#2a1d10}
.pbox.seller .go{color:#2a1d10}
.pbox.autumn{background:linear-gradient(170deg,#f2893a,#d8541a)}
.pbox.deal{background:linear-gradient(170deg,#4a3224,#2b1d14)}
@media (max-width:900px){.side{position:static;grid-template-columns:repeat(3,1fr)}.pbox{min-height:170px}.pbox b{font-size:15px}.pbox .ico{font-size:48px;bottom:50px}}
@media (max-width:760px){.side{gap:8px}.pbox{min-height:150px;padding:14px 12px}.pbox b{font-size:13px}.pbox .ico{font-size:40px;bottom:46px}.pbox .go{width:26px;height:26px;font-size:15px}}
.more{margin-left:auto;font-size:13px;font-weight:700;color:var(--or);padding:6px 14px;background:#fff0e0;border-radius:999px;white-space:nowrap}
.more:hover{background:var(--or);color:#fff}
.side{position:sticky;top:150px;margin-top:20px}
@media (max-width:900px){.side{position:static;margin-top:22px}}
.backbar{position:fixed;top:140px;left:max(14px,calc(50% - 620px));z-index:90;margin:0}
.backbar[hidden]{display:none}
.backbar .back{box-shadow:0 8px 24px rgba(60,40,20,.16)}

.kicker{display:block;font-size:12px;font-weight:700;color:var(--or);margin-bottom:4px}
.brand .sh h2{font-size:20px}
/* 빈칸 없는 상품 격자: 마지막 줄 상품이 적어도 가로를 채움 */
.grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tgrid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.grid>.card:last-child:nth-child(odd){grid-column:1/-1}}
.fastbar{background:#fff4ec;padding:9px 0}
.fb-in{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.fbox{flex:none;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;background:#fff;color:#b8400f}
.fbox.f1{background:var(--or);color:#fff}
.sellpill{background:transparent;color:#5a504a;padding:7px 14px;border-radius:999px;font-weight:500;transition:background .25s,color .25s}

.sellpill:hover{background:var(--or2)}
.catgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-top:18px;background:#fff;border-radius:22px;padding:18px 10px}
.catgrid a{text-align:center;font-size:12px;font-weight:500;color:#4e4640;display:flex;flex-direction:column;gap:6px;align-items:center}
.catgrid span{width:52px;height:52px;border-radius:18px;background:linear-gradient(160deg,#fff1e4,#ffdcc0);display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .2s}
.catgrid a:hover span{transform:translateY(-3px);background:var(--or)}
.pop{position:fixed;inset:0;background:rgba(43,26,16,.55);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px}
.pop[hidden]{display:none}
.pop-card{position:relative;background:linear-gradient(160deg,#ff5a1f,#ffb020);color:#fff;border-radius:26px;padding:34px 30px;max-width:380px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.pop-card h2{font-size:28px;font-weight:900;line-height:1.25;margin:12px 0}
.pop-card p{opacity:.95;font-size:14px}
.pop-tag{background:#fff;color:#ff5a1f;font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px}
.pop-x{position:absolute;top:14px;right:16px;color:#fff;font-size:18px}
.pop-btns{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.pop-card .btn.inline{background:#fff;color:#ff5a1f}
.pop-later{color:#fff;font-size:13px;text-decoration:underline}
@media (max-width:760px){.catgrid{grid-template-columns:repeat(5,1fr)}.catgrid span{width:46px;height:46px}}
/* 상품 박스: 처음부터 모두 같은 크기 */
.grid>.card:last-child:nth-child(odd){grid-column:auto}
.pname{min-height:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.filltile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:18px;background:var(--soft);padding:18px;text-align:center;color:var(--ink);min-height:200px}
.filltile span{font-size:34px}
.filltile b{font-size:14px;font-weight:700}
.filltile em{font-style:normal;font-size:12px;color:var(--or);font-weight:700}
/* 상단 빠른배송: 반으로 나뉜 배너 3개 */
.fastbar{background:#fff;padding:10px 0}
.fb-in{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;overflow:visible}
.sbanner{display:grid;grid-template-columns:1fr 1fr;height:50px;border-radius:12px;overflow:hidden}
.half{display:flex;align-items:center;gap:8px;padding:0 16px;font-size:14px;font-weight:700;white-space:nowrap;min-width:0}
.half i{font-style:normal;font-size:18px}
.half em{font-style:normal;margin-left:auto;font-size:20px}
.half.l{background:#dff3fd;color:#0d4e7a}
.half.r{background:var(--or);color:#fff}
.b2 .half.l{background:#fff0d6;color:#7a4a10}
.b2 .half.r{background:var(--ink)}
.b3 .half.l{background:#e7f6ec;color:#1d5a2b}
.b3 .half.r{background:#2b1a10}
@media (max-width:760px){.fb-in{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:250px;overflow-x:auto;scrollbar-width:none}.half{font-size:12px;padding:0 10px}}
/* 상단 빠른배송·무료배송: 한 줄 박스 */
.lbox{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-radius:12px;font-size:14px;white-space:nowrap;overflow:hidden;color:var(--ink)}
.lbox i{font-style:normal;font-size:18px}
.lbox b{font-weight:700}
.lbox span{opacity:.85;overflow:hidden;text-overflow:ellipsis}
.lbox em{font-style:normal;margin-left:auto;font-size:20px;color:var(--or);font-weight:700}
.lbox.b1{background:#dff3fd}
.lbox.b2{background:#fff0d6}
@media (max-width:760px){.lbox{font-size:12px;padding:0 12px;gap:6px}.lbox i{font-size:15px}}
.bgrid{grid-template-columns:repeat(4,1fr)}
.bgrid .thumb{height:170px}
@media (max-width:900px){.bgrid{grid-template-columns:repeat(2,1fr)}}
.mdet{margin-top:14px;text-align:center}
.mdet summary{display:inline-block;padding:11px 22px;background:var(--or);color:#fff;border-radius:999px;font-weight:700;cursor:pointer;list-style:none}
.mdet summary::-webkit-details-marker{display:none}
.mdet[open] summary{background:var(--ink)}
.mdet .grid{margin-top:14px;text-align:left}
.mp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mp-stats a{background:var(--soft);border-radius:16px;padding:16px;text-align:center;font-size:13px;color:#5a504a}
.mp-stats b{display:block;font-size:20px;color:var(--ink);margin-bottom:2px}
.mp-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;font-size:13px;color:#5a504a}
.mp-steps b{display:block;font-size:22px;color:var(--or)}
@media (max-width:760px){.mp-stats,.mp-steps{grid-template-columns:repeat(2,1fr)}}
/* 로고 이미지 */
.logo img{height:40px;width:auto;display:block}
@media (max-width:760px){.logo img{height:32px}}
/* 카테고리 아이콘: 팔레트 색 원형 */
.catgrid span{border-radius:50%;width:56px;height:56px}
.catgrid a:nth-child(4n+1) span{background:var(--or)}
.catgrid a:nth-child(4n+2) span{background:var(--ye)}
.catgrid a:nth-child(4n+3) span{background:var(--teal)}
.catgrid a:nth-child(4n+4) span{background:var(--or2)}
@media (max-width:760px){.catgrid span{width:46px;height:46px}}
/* 오른쪽 박스·팝업: Retro sunset 팔레트 */
.pbox.seller{background:var(--ye);color:#3a2000}
.pbox.seller .go{color:#3a2000}
.pbox.autumn{background:linear-gradient(170deg,#D9860C,var(--or2))}
.pbox.deal{background:linear-gradient(170deg,var(--teal),#045E5E)}
.pop-card{background:linear-gradient(160deg,var(--or2),var(--or) 55%,var(--teal))}
/* 둘째 줄: 전체 카테고리 + 탭 메뉴 */
.navrow{display:flex;align-items:center;gap:4px;padding:2px 0 10px;overflow-x:auto;scrollbar-width:none}
.navrow::-webkit-scrollbar{display:none}
.navrow .cat-open{margin-right:12px}
.navrow .tab{padding:8px 14px;font-weight:700;font-size:15px;color:#3a2a20;white-space:nowrap;border-radius:999px}

/* 히어로 텍스트와 점 */
.hero .slide small{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.dots i{width:8px;height:8px}
.dots i.on{background:var(--ye)}
/* 카테고리 패널 */
.catgrid{background:#f6f1ea}
/* 상품 카드 배지와 하트 */
.card{position:relative}
.bdg{position:absolute;top:12px;left:12px;z-index:2;font-size:11px;font-weight:900;color:#fff;background:var(--or);padding:3px 9px;border-radius:6px}
.bdg.sale{background:var(--teal)}
.bdg.new{background:var(--ye);color:#3a2000}
.hrt{position:absolute;top:8px;right:10px;z-index:2;font-size:20px;line-height:1;color:var(--or);background:rgba(255,255,255,.9);width:34px;height:34px;border-radius:50%}
/* 섹션 제목 크게 */
.brand .sh h2{font-size:26px;font-weight:900}
@media (max-width:760px){.navrow .tab{padding:7px 11px;font-size:14px}.brand .sh h2{font-size:21px}}
/* 언어 선택 버튼 (푸터) */
.langs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 6px}

.langs button:hover{background:rgba(255,255,255,.22)}
.langs button.on{background:var(--or);color:#fff;font-weight:700}
/* PC 상단: 로고 · 중앙 메뉴(로그인~장바구니) · 검색 */
@media (min-width:761px){
  .top{display:grid;grid-template-columns:200px 1fr 320px;align-items:center;gap:16px}
  .logo{grid-column:1}
  .icons{grid-column:2;justify-self:center;margin:0;gap:18px}
  .search{grid-column:3;max-width:none;flex:none}
}
/* 빠른 배송 박스: 전체 폭 한 줄 */
.fb-in{grid-template-columns:1fr}

.navrow{gap:8px}
/* 헤더 재배치 (PC): 1줄 로고 + 긴 검색창 / 2줄 메뉴(로그인~장바구니) 중앙 / 3줄 카테고리·탭 중앙 */
@media (min-width:761px){
  .top{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:12px 24px;padding:12px 0 8px}
  .logo{grid-column:1;grid-row:1}
  .search{grid-column:2;grid-row:1;max-width:none;flex:none;width:100%}

/* 휴대폰: 세로 쌓기, 모두 가운데 정렬 */
@media (max-width:760px){
  .top{justify-content:center;gap:10px}
  .logo{width:100%;display:flex;justify-content:center}
  .search{order:2;flex:1 1 100%;max-width:none}
  .icons{order:3;width:100%;justify-content:center}
  .navrow{justify-content:safe center;padding:2px 0 10px}
}
/* 헤더 줄: 좌우 여백을 두고 가로를 꽉 채움 (로그인 줄 · 카테고리 줄) */
header .wrap{width:auto;max-width:none;margin:0 16px}
@media (min-width:761px){
  .icons{justify-self:stretch;width:100%;justify-content:space-between;gap:0;margin:0}
  .navrow{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;align-items:center}
  .navrow .tab{text-align:center}
}
@media (max-width:760px){
  header .wrap{margin:0 12px}
  .icons{justify-content:space-evenly;gap:0;width:100%}

  .navrow .cat-open{grid-column:1 / -1;width:100%;margin:0}
  .navrow .tab{padding:8px 2px;font-size:13px;text-align:center}
}
/* 휴대폰: 로그인 줄은 오른쪽 정렬, 전체 카테고리 버튼은 탭 줄(홈~기획전) 아래 */

  .icons{justify-content:flex-end;gap:12px;width:100%}
  .navrow .cat-open{order:2}
}
/* PC: 로그인부터 장바구니까지 오른쪽 끝 정렬 */

  .icons{justify-content:flex-end;gap:22px;width:100%}
}

@media (min-width:761px){ .icons{gap:10px} }
@media (max-width:760px){ .icons{gap:8px} }
/* PC: 로그인 줄은 신상품 칸부터 시작, 장바구니는 기획전 칸 끝에 맞춤 (카테고리 줄과 같은 칸 구조) */

}

  .navrow .tab{width:auto;flex:none;padding:8px 14px;text-align:center}
  .icons{display:flex;width:100%;margin:0;justify-content:flex-start;white-space:nowrap}

/* 키보드 포커스 표시 */
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
/* 휴대폰 하단 메뉴 · 상품 하단 구매 막대 */

  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}

  .mtab a,.mtab button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#5a504a;padding:4px 0;background:none;border:0}
  .mtab span{font-size:18px}

  .mbar .ed{flex:1}

/* 가을 세일 팝업 이미지 */
.pop-img{display:block;width:100%;height:auto;border-radius:18px;margin-bottom:16px}
.pop-x{z-index:2;background:rgba(0,0,0,.35);width:30px;height:30px;border-radius:50%;line-height:30px;text-align:center}

.pop-title span{display:block;font-family:"Noto Sans KR",system-ui,sans-serif;font-weight:900;font-size:clamp(28px,7.6vw,52px);letter-spacing:.1em;line-height:1.1;color:#FFCE1B;text-shadow:0 3px 0 #7a2e12}

}

/* 찜질방 패키지 사진 */
.thumb img,.pimg{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block}
.ce img{width:52px;height:40px;object-fit:cover;border-radius:8px;display:inline-block}
.pbox .ico img{width:72px;height:72px;object-fit:cover;border-radius:14px;display:block}
/* 홈 금주의 특가왕 박스: 사진이 박스 전체를 채움 */
.pbox.deal{position:relative;overflow:hidden;padding:0;min-height:260px;color:#fff}
.pbox.deal .ico{position:absolute;inset:0;right:auto;bottom:auto;transform:none;font-size:0;line-height:0;z-index:0}
.pbox.deal .ico img{width:100%;height:100%;object-fit:cover;border-radius:0;display:block}
.pbox.deal::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(20,10,5,.05) 0%,rgba(20,10,5,.35) 45%,rgba(20,10,5,.82) 100%);pointer-events:none}
.pbox.deal small,.pbox.deal b,.pbox.deal .go{position:relative;z-index:1}
.pbox.deal small{position:absolute;top:18px;left:20px;margin:0}
.pbox.deal > div,.pbox.deal b{position:relative;z-index:1}
.pbox.deal b{position:absolute;left:20px;right:20px;bottom:52px;margin:0;max-width:none}
.pbox.deal .go{position:absolute;left:20px;bottom:16px;margin:0}
@media (max-width:900px){.pbox.deal{min-height:180px}.pbox.deal b{bottom:44px;font-size:14px}}
/* 전체 카테고리: 분야별 묶음 */
#catList .cg{list-style:none;padding:8px 0 4px}
#catList .cgt{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--or);padding:8px 22px 6px}
#catList .cgl{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 12px}
#catList .cgl a{display:flex;align-items:center;gap:8px;padding:10px 10px;border-radius:12px;font-size:14px;margin:0}
#catList .cge{font-size:18px;width:24px;text-align:center;flex:none}
/* 카테고리 드로어 안쪽 디자인 */
.drawer{background:#fffaf3}
.dh{background:linear-gradient(120deg,var(--or),var(--or2));color:#fff;padding:22px 22px 18px;font-size:19px;font-weight:900;letter-spacing:.02em}
.dh button{color:#fff;font-size:22px;opacity:.92}
#catList{padding:12px 12px 6px}
#catList .cg{background:#fff;border-radius:20px;margin:0 0 12px;padding:4px 0 10px;box-shadow:0 6px 18px rgba(60,40,20,.06)}
#catList .cgt{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;color:var(--rust);padding:12px 16px 6px;letter-spacing:.02em}
#catList .cgt::before{content:"";width:6px;height:16px;border-radius:3px;background:var(--or);flex:none}
#catList .cgl{padding:4px 10px;gap:6px}
#catList .cgl a{background:#fff8ee;border-radius:16px;padding:9px 10px;font-size:14px;font-weight:500;color:var(--ink);gap:10px;margin:0;transition:background .2s,color .2s,transform .2s}
#catList .cgl a:hover{background:var(--or);color:#fff;transform:translateY(-1px)}
#catList .cge{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;box-shadow:0 2px 6px rgba(60,40,20,.08);transition:background .2s}
#catList .cgl a:hover .cge{background:rgba(255,255,255,.24)}
#catList .cg:nth-child(3n+1) .cge{background:#fff0c2}
#catList .cg:nth-child(3n+2) .cge{background:#d8efec}
#catList .cg:nth-child(3n) .cge{background:#fde3d0}
.dquick{flex-wrap:wrap;gap:6px;padding:12px;background:#fffaf3;justify-content:center}
.dquick a{background:var(--soft);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--ink)}
.dquick a:hover{background:var(--or);color:#fff}
.dfoot{background:#fffaf3;padding:10px 14px 16px}
/* 검색 추천 창 */
.sbox{position:relative;flex:1 1 260px;min-width:0;max-width:640px}
.sbox .search{max-width:none;width:100%}
.sugbox{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border-radius:18px;box-shadow:0 18px 40px rgba(60,40,20,.16);padding:10px;z-index:200;max-height:420px;overflow-y:auto}
.sughd{font-size:12px;font-weight:700;color:var(--rust);padding:6px 10px 8px}
.sugi{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;color:var(--ink)}
.sugi:hover{background:#fff4e6}
.sugt{width:38px;height:38px;border-radius:50%;background:#fff3e0;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.sugn{flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugp{font-size:13px;font-weight:700;color:var(--rust);white-space:nowrap}
.sugempty{padding:16px;text-align:center;color:var(--sub);font-size:14px}
/* 검색 상자 배치: PC 1줄 둘째 칸, 휴대폰 전체 폭 */
@media (min-width:761px){ .sbox{grid-column:2;grid-row:1;width:100%;max-width:none} }
@media (max-width:760px){ .sbox{order:2;flex:1 1 100%;max-width:none;width:100%} }
/* 카테고리 탭 글씨: 과하게 튀지 않도록 얇고 부드럽게, 현재 탭만 강조 */
.navrow .tab{font-weight:500;color:#5a4a40;text-shadow:none;letter-spacing:0;transition:background .2s,color .2s}
.navrow .tab:hover{background:#fff1e3;color:var(--or)}
.navrow .tab.on{font-weight:700;color:var(--or)}
/* 헤더: 배경을 완전히 불투명하게 해서 스크롤 시 아래 내용이 비쳐 겹치지 않도록 */
header{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;isolation:isolate}
/* 헤더 줄들이 같은 쌓임 기준을 쓰도록 해서 검색 추천 창이 탭 줄 위에 보이게 함 */
header .wrap{z-index:auto}
header .top{position:relative;z-index:auto}
.sugbox{z-index:300}

/* 가을 여행 나들이 박스: 가을 색 톤을 씌워 색이 살아 보이게 */
.pbox.autumn::after{background:linear-gradient(180deg,rgba(232,115,26,.28) 0%,rgba(150,70,20,.55) 50%,rgba(70,28,8,.9) 100%)}
.pbox.autumn b{color:var(--ye);text-shadow:0 2px 10px rgba(60,20,0,.35)}
.pbox.autumn small{color:#fff3e0}
/* 가을 여행 나들이 박스: 글자 뒤까지 가을 색 면이 채워지고, 글자는 흰색 */
.pbox.autumn::after{background:linear-gradient(180deg,rgba(150,70,20,0) 0%,rgba(150,70,20,.82) 38%,rgba(120,52,14,.94) 70%,rgba(100,42,10,.96) 100%)}
.pbox.autumn b{color:#fff;text-shadow:0 2px 8px rgba(40,15,0,.3)}
.pbox.autumn small{color:#fff}
/* 두 박스: 사진에서 색 면으로 경계 없이 이어지고, 글자 뒤까지 한 가지 색으로 채움 */
.pbox.deal::after{background:linear-gradient(180deg,rgba(4,80,84,0) 0%,rgba(4,80,84,.55) 30%,rgba(4,80,84,.92) 52%,rgba(4,80,84,1) 100%)}
.pbox.autumn::after{background:linear-gradient(180deg,rgba(122,62,18,0) 0%,rgba(122,62,18,.55) 30%,rgba(122,62,18,.92) 52%,rgba(122,62,18,1) 100%)}
.pbox.deal b,.pbox.autumn b{color:#fff;text-shadow:none}
.pbox.deal small,.pbox.autumn small{color:#fff}

function trText(s, L){
  if (L === 'ko' || !s) return s;
  const i = L === 'en' ? 0 : L === 'zh' ? 1 : 2;
  NUM_RE.forEach(([re, v]) => { s = s.replace(re, v[i]); });
  PHRASES.forEach(([ko, v]) => { if (s.includes(ko)) s = s.split(ko).join(v[i]); });
  return s.replace(/([\d,]+)원/g, '₩$1');
}

    const v = trText(n.__ko, LANG); if (n.nodeValue !== v) n.nodeValue = v;
  });
  root.querySelectorAll('input[placeholder], textarea[placeholder]').forEach(el => {
    if (el.hasAttribute('data-i18n-ph')) return;
    if (el.__ph === undefined) el.__ph = el.getAttribute('placeholder');
    el.setAttribute('placeholder', trText(el.__ph, LANG));
  });
}

function sortList(l, k){
  const a = [...l];

function couponState(c){
  if (S.coupons.used.includes(c.id)) return 'used';
  if (c.exp < TODAY) return 'expired';
  return 'ok';
}
function couponDisc(c, total, ship){
  if (!c || total < (c.min || 0)) return {d:0, s:0};
  if (c.type === 'ship') return {d:0, s:Math.min(c.v, ship)};
  if (c.type === 'pct') return {d:Math.min(Math.floor(total * c.v / 100), c.max || Infinity), s:0};
  return {d:Math.min(c.v, total), s:0};
}

  return COUPONS.filter(c => S.coupons.owned.includes(c.id) && couponState(c) === 'ok' && total >= (c.min || 0));

function render(){
  const [p, q=''] = (location.hash.slice(1) || '/home').split('?');
  const parts = p.split('/').filter(Boolean);
  const [n, id] = parts;
  const cur = location.hash || '#/home';
  if (NAV[NAV.length-1] !== cur) NAV.push(cur);
  const back = n && n !== 'home' ? `<div class="backbar"><button class="back" id="backBtn">← 이전 페이지</button></div>` : '';
  $('#backWrap').hidden = !(n && n !== 'home');
  $('#app').innerHTML = (V[n] || V.home)(id, new URLSearchParams(q));
  document.querySelectorAll('.ad, .hero').forEach(c => go(c, 0));
  updateHeader();
}
window.addEventListener('hashchange', () => { render(); fillGrids(); window.scrollTo(0,0); setDrawer(false); });
function changeQty(i, d){ const c = S.cart[i]; if (!c) return; c.q = Math.max(1, c.q + d); save(); render(); }
function toast(m){ const t = $('#toast'); t.textContent = trText(m, LANG); t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1800); }

// 클릭 처리
document.addEventListener('click', e => {
  const t = e.target;
  const lg = t.closest('[data-lang]');
  if (lg) { LANG = lg.dataset.lang; try { localStorage.setItem('mn5_lang', LANG); } catch(e) {} applyLang(); renderCats(); render(); fillGrids(); return; }
  const gl = t.closest('[data-go]');
  if (gl) { location.hash = gl.dataset.go; return; }
  const cl = t.closest('[data-claim]');
  if (cl) {
    if (!S.user) { toast('로그인 후 받을 수 있어요'); location.hash = '#/login'; return; }
    if (!S.coupons.owned.includes(cl.dataset.claim)) S.coupons.owned.push(cl.dataset.claim);
    saveCoupons(); toast('쿠폰을 받았어요'); render(); return;
  }
  if (S.user && S.cpUse && t.closest('[data-pay],[data-checkout]')) {
    S.coupons.used.push(S.cpUse); S.cpUse = null; saveCoupons();
  }
  if (S.user && t.closest('[data-pay],[data-checkout]') && S.lastPaid > 0) applyPoints();
  const eye = t.closest('.eye');
  if (eye) {
    const inp = eye.parentElement.querySelector('input');
    const showing = inp.type === 'password';
    inp.type = showing ? 'text' : 'password';
    eye.innerHTML = showing ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10c3 4.5 7 6.5 10 6.5S19 14.5 22 10"/><path d="M6 14.5l-1.5 2.5M12 16.5V20M18 14.5l1.5 2.5"/></svg>';
    eye.setAttribute('aria-label', showing ? '비밀번호 숨기기' : '비밀번호 표시');
    return;
  }
  if (t.closest('#mCat')) { setDrawer(true); return; }
  if (t.closest('#mSearch')) { window.scrollTo(0,0); $('#searchForm input').focus(); return; }
  if (t.closest('#backBtn')) { goBack(); return; }
  if (t.closest('#catOpen')) { setDrawer(true); return; }
  if (t.closest('#overlay') || t.closest('#drawerClose')) { setDrawer(false); return; }
  if (t.closest('#catList a')) { setDrawer(false); return; }
  if (t.closest('#editBtn')) { S.edit = true; renderCats(); return; }
  if (t.closest('#doneBtn')) { S.edit = false; renderCats(); return; }
  if (t.closest('#resetBtn')) { S.cats = {order:CATS.map(c=>c.id), hidden:[]}; persist(); toast('카테고리를 기본 상태로 되돌렸어요'); return; }
  const mv = t.closest('[data-mv]'); if (mv) { move(+mv.dataset.i, +mv.dataset.i + +mv.dataset.mv); return; }
  const nav = t.closest('[data-nav]'); if (nav) { go(nav.closest('.ad, .hero'), +nav.dataset.nav); return; }

  const pq = t.closest('[data-pq]');
  if (pq) { PQ.q = Math.max(1, PQ.q + +pq.dataset.pq); $('#pq').textContent = PQ.q; const p = PRODUCTS.find(x=>x.id===PQ.id); $('#ptot').textContent = won(p.p * PQ.q); return; }
  const hf = t.closest('[data-hfav]');
  if (hf) { const id = +hf.dataset.hfav, k = S.fav.indexOf(id); if (k > -1) S.fav.splice(k,1); else S.fav.push(id); save(); hf.textContent = k > -1 ? '♡' : '♥'; updateHeader(); return; }
  const fav = t.closest('[data-fav]');
  if (fav) {
    const id = +fav.dataset.fav, k = S.fav.indexOf(id);
    if (k > -1) { S.fav.splice(k,1); toast('즐겨찾기에서 뺐어요'); } else { S.fav.push(id); toast('즐겨찾기에 추가했어요'); }
    save(); fav.classList.toggle('on', k < 0); fav.textContent = k < 0 ? '♥ 즐겨찾기 됨' : '♡ 즐겨찾기'; updateHeader(); return;
  }
  const addp = t.closest('[data-addp]');
  if (addp) { const p = PRODUCTS.find(x=>x.id===+addp.dataset.addp); const s = selOK(p); if (s) addCart(p.id, s.sz, s.op, PQ.q); return; }
  const buy = t.closest('[data-buy]');
  if (buy) {
    const p = PRODUCTS.find(x=>x.id===+buy.dataset.buy); const s = selOK(p);
    if (!s) return;
    if (!S.user) { toast('로그인 후 바로 구매할 수 있어요'); location.hash = '#/login'; return; }
    S.order = {id:p.id, sz:s.sz, op:s.op, q:PQ.q}; location.hash = '#/order'; return;
  }
  if (t.closest('[data-pay]')) {
    const pid = S.order && S.order.id;
    if (pid != null) S.fav = S.fav.filter(id => id !== pid);
    S.order = null; save();
    toast('주문이 접수되었습니다. 찜한 상품에서 삭제했어요');
    location.hash = '#/home'; return;
  }

  const qi = t.closest('[data-qi]'); if (qi) { changeQty(+qi.dataset.qi, +qi.dataset.d); return; }
  const rmi = t.closest('[data-rmi]'); if (rmi) { S.cart.splice(+rmi.dataset.rmi, 1); save(); render(); return; }
  if (t.closest('[data-logout]')) { S.user = null; toast('로그아웃되었습니다'); location.hash = '#/home'; render(); return; }
  if (t.closest('[data-checkout]')) {
    if (!S.user) { toast('로그인 후 주문할 수 있어요'); location.hash = '#/login'; return; }
    S.fav = S.fav.filter(id => !S.cart.some(c => c.id === id));
    S.cart = []; save();
    toast('주문이 접수되었습니다. 찜한 상품에서 삭제했어요');
    render(); return;
  }
});

// 폼 제출
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, err = f.querySelector('.err');
  const v = n => (f.elements[n] ? f.elements[n].value.trim() : '');
  const fail = m => { if (err) err.textContent = m; };
  if (f.id === 'searchForm') {
    const k = v('q'); if (!k) { toast('검색어를 입력해 주세요'); return; }
    location.hash = '#/search?q=' + encodeURIComponent(k); render(); return;
  }
  if (f.id === 'loginForm') {
    const em = v('email'), pw = f.elements.pw.value;
    if (!/^\S+@\S+\.\S+$/.test(em)) return fail('이메일 형식을 확인해 주세요');
    if (pw.length < 6) return fail('비밀번호는 6자 이상이어야 해요');
    S.user = {name: em.split('@')[0], email: em}; toast('로그인되었습니다'); location.hash = '#/home'; render(); return;
  }
  if (f.id === 'signupForm') {
    const name = v('name'), em = v('email'), pw = f.elements.pw.value;
    if (!name) return fail('이름을 입력해 주세요');
    if (!/^\S+@\S+\.\S+$/.test(em)) return fail('이메일 형식을 확인해 주세요');
    if (pw.length < 8) return fail('비밀번호는 8자 이상이어야 해요');
    if (pw !== f.elements.pw2.value) return fail('비밀번호가 일치하지 않아요');
    if (!f.elements.terms.checked) return fail('약관에 동의해 주세요');
    S.user = {name, email: em}; toast('가입을 환영합니다!'); location.hash = '#/home'; render(); return;
  }
  if (f.id === 'sellerForm') {
    if (!/^\d{3}-?\d{2}-?\d{5}$/.test(v('biz'))) return fail('사업자등록번호 10자리를 확인해 주세요');
    if (!/^01\d-?\d{3,4}-?\d{4}$/.test(v('tel'))) return fail('연락처 형식을 확인해 주세요');
    if (!S.user) { toast('판매자 가입은 로그인 후 가능해요'); location.hash = '#/login'; return; }
    S.seller = {shop: v('shop'), cat: v('cat'), ceo: v('ceo')};
    try { localStorage.setItem('mn5_seller', JSON.stringify(S.seller)); } catch(e) {}
    if (err) err.textContent = ''; toast('판매자 가입이 완료되었어요'); location.hash = '#/sellerhome'; render(); return;
  }
  if (f.id === 'itemForm') {
    const n = v('name'), p = +v('price'), o = +v('orig') || Math.round(p * 1.25);
    if (!n || !p) return fail('상품명과 판매가를 입력해 주세요');
    const id = Date.now();
    const it = {id, cat: v('cat'), n, p, o, e: f.elements.e.value, x: 0, d: v('desc') || '판매자가 등록한 상품입니다', ch: [], sz: 0, r: 0, s: 0, rc: 0, g: '', fam: id};
    PRODUCTS.push(it); S.items.push(it); saveItems(); f.reset(); toast('상품이 등록되었어요'); render(); return;
  }
  if (f.id === 'inqForm' || f.id === 'pInqForm') {
    if (!v('body')) return fail('문의 내용을 입력해 주세요');
    if (err) err.textContent = ''; f.reset(); toast('문의가 접수되었습니다'); return;
  }
});

// 시작
applyLang();
// 이전 버튼: 헤더 바로 아래에 두고, 스크롤해도 고정
function placeBack(){
  const h = document.querySelector('header');
  $('#backWrap').style.top = Math.max(12, Math.round(h.getBoundingClientRect().bottom + 10)) + 'px';
}
window.addEventListener('scroll', placeBack, {passive:true});
window.addEventListener('resize', () => { placeBack(); fillGrids(); });
const EMOJIS = ['🍁','🍂','🎁','👕','🍳','🧴','🎧','🧸','📚','🚗','🐾','✈️'];
// 빈칸 없는 격자: 마지막 줄 상품 수에 맞춰 마지막 상품이 남은 칸을 채움
const FILL = [];
function fillGrids(){
  document.querySelectorAll('.grid,.tgrid').forEach(g => {
    g.querySelectorAll('.filltile').forEach(x => x.remove());
    const cols = getComputedStyle(g).gridTemplateColumns.split(' ').length;
    const rem = g.children.length % cols;
    for (let i = 0; rem && FILL.length && i < cols - rem; i++) { const f = FILL[i % FILL.length]; const a = document.createElement('a'); a.className = 'filltile'; a.href = f.h; a.innerHTML = `<span>${f.e}</span><b>${f.t}</b><em>더 보기 ›</em>`; g.appendChild(a); }
  });
}
function saveItems(){ try { localStorage.setItem('mn5_items', JSON.stringify(S.items)); } catch(e) {} }
// 가을 세일 팝업 (오늘 하루 보지 않기)
function setupPop(){
  const pop = $('#pop'), close = () => { pop.hidden = true; };
  let hide = false; try { hide = localStorage.getItem('mn5_pop') === new Date().toDateString(); } catch(e) {}
  pop.hidden = hide;
  $('#popX').onclick = close; $('#popGo').onclick = close;
  $('#popToday').onclick = () => { try { localStorage.setItem('mn5_pop', new Date().toDateString()); } catch(e) {} close(); };
}
renderCats();
render();
placeBack();
fillGrids();
setupPop();
document.addEventListener('toggle', fillGrids, true);
// 화면을 다시 그릴 때마다 선택 언어로 바꿈
// 현재 화면 주소와 같은 탭에만 색을 표시
function markTab(){ const h = location.hash || '#/home'; document.querySelectorAll('.navrow .tab').forEach(a => a.classList.toggle('on', a.getAttribute('href') === h)); }
const _render = render; render = function(){
  _render();
  const pm = location.hash.match(/^#\/p\/(\d+)/);
  document.body.classList.toggle('pd-page', !!pm);
  if (pm) $('#app').insertAdjacentHTML('beforeend', `<div class="mbar"><button class="ed ghost" data-addp="${pm[1]}">장바구니 담기</button><button class="ed" data-buy="${pm[1]}">바로 구매</button></div>`);
  const route = location.hash.split('?')[0];
  if (S.user && (route === '#/cart' || route === '#/order')) {
    const total = route === '#/order' ? (S.order ? PRODUCTS.find(x => x.id === S.order.id).p * S.order.q : 0) : S.cart.reduce((a,c) => a + PRODUCTS.find(x => x.id === c.id).p * c.q, 0);
    if (total > 0) {
      const ship = total >= 30000 ? 0 : 3000;
      const usable = usableCoupons(total);
      const cur = usable.find(c => c.id === S.cpUse) || null;
      if (!cur) S.cpUse = null;
      const dd = couponDisc(cur, total, ship);
      const restAmt = total + ship - dd.d - dd.s; const ptAmt = S.ptUse ? Math.min(S.pts.bal, restAmt) : 0;
      S.lastPaid = restAmt - ptAmt; S.lastPt = restAmt;
      $('#app').insertAdjacentHTML('beforeend', `<section class="sec cpuse"><div class="sh"><h2>쿠폰 적용</h2></div><select id="cpSel" class="cpsel"><option value="">쿠폰 사용 안함</option>${usable.map(c => `<option value="${c.id}" ${c.id===S.cpUse?'selected':''}>${c.n} (${c.d})</option>`).join('')}</select>${usable.length ? '' : '<p class="muted">사용 가능한 쿠폰이 없어요</p>'}${S.pts.bal > 0 ? `<label class="ptchk"><input type="checkbox" id="ptUse" ${S.ptUse ? 'checked' : ''}> 적립금 사용 (보유 ${won(S.pts.bal)})</label>` : ''}<p class="cpsum">할인 금액 -${fmt(dd.d + dd.s)}원 · 적립금 -${fmt(ptAmt)}원 · 최종 결제 금액 ${won(restAmt - ptAmt)}</p></section>`);
    }
  }
  localizeDom(document.body); markTab(); fillSuggest();
};
// 검색 자동완성 목록 (선택 언어로 상품명 표시)
function fillSuggest(){}
const _renderCats = renderCats; renderCats = function(){ _renderCats(); localizeDom(document.body); };
localizeDom(document.body);
// PC(761px 이상): 로그인 줄을 신상품 글자 왼쪽 끝 ~ 기획전 글자 오른쪽 끝에 맞춤
function alignLogin(){
  const ig = document.querySelector('#icons .ig'), nav = document.querySelector('.navrow'), icons = document.querySelector('#icons');
  if (!ig || !nav || !icons) return;
  if (window.innerWidth < 761) { ig.style.marginLeft = ''; ig.style.width = ''; return; }
  const tabs = nav.querySelectorAll('.tab'), base = icons.getBoundingClientRect();
  const a = tabs[2].getBoundingClientRect(), b = tabs[4].getBoundingClientRect();
  ig.style.marginLeft = (a.left - base.left) + 'px';
  ig.style.width = (b.right - a.left) + 'px';
}
const _updateHeader = updateHeader; updateHeader = function(){ _updateHeader(); alignLogin(); };
window.addEventListener('resize', alignLogin);
if (document.fonts) document.fonts.ready.then(alignLogin);
alignLogin();
markTab();
document.addEventListener('change', e => { if (e.target.id === 'cpSel') { S.cpUse = e.target.value || null; render(); } if (e.target.id === 'ptUse') { S.ptUse = e.target.checked; render(); } });
// 검색 추천 창 열기·닫기
const sInp = $('#searchForm input');
sInp.addEventListener('input', renderSug);
sInp.addEventListener('focus', renderSug);
sInp.addEventListener('keydown', e => { if (e.key === 'Escape') $('#sugBox').hidden = true; });
document.addEventListener('click', e => { if (!e.target.closest('.sbox')) $('#sugBox').hidden = true; });
$('#sugBox').addEventListener('click', e => { if (e.target.closest('a')) $('#sugBox').hidden = true; });
window.addEventListener('hashchange', () => { $('#sugBox').hidden = true; });
</script>
